
services:
  db:
    container_name: postgres-engineer-directory
    image: postgres:17
    environment:
      POSTGRES_USER: engineer_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: engineer_directory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5332:5432"
    restart: unless-stopped

volumes:
  postgres_data:
