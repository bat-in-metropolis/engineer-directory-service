spring.application.name=engineer-directory-service
# Share the local, gitignored password with Docker Compose. Run from the project root.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://127.0.0.1:5332/engineer_directory
spring.datasource.username=engineer_user
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
